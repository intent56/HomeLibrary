{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4">
            <div class="text-center text-md-start mb-3 mb-md-0">
                <h2><i class="bi bi-people"></i> Список жанров</h2>
                <p class="text-muted mb-0">Всего жанров: {{ total_genres }}</p>
            </div>
            <div class="d-flex gap-2 flex-wrap justify-content-center">
                <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary d-flex align-items-center">
                    <i class="bi bi-house me-1"></i> На главную
                </a>
                <a href="{{ url_for('main.add_genre') }}" class="btn btn-primary d-flex align-items-center">
                    <i class="bi bi-plus-circle me-1"></i> Добавить жанр
                </a>
            </div>
        </div>

        <!-- Поиск с HTMX -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-10">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control" id="searchInput" name="search"
                                placeholder="Поиск по названию жанра..." value="{{ search or '' }}"
                                hx-get="{{ url_for('main.genre_list') }}" hx-trigger="keyup changed delay:300ms"
                                hx-target="#genreGridContainer" hx-indicator="#loadingIndicator" hx-push-url="true"
                                hx-vals='{"page": 1}'>
                            <span class="input-group-text" id="loadingIndicator" style="display: none;">
                                <span class="spinner-border spinner-border-sm" role="status"></span>
                            </span>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-secondary w-100" onclick="resetSearch()">
                            <i class="bi bi-arrow-counterclockwise"></i> Сброс
                        </button>
                    </div>
                </div>
                <div class="mt-2">
                    <span class="text-muted small" id="resultCount">
                        Найдено: {{ total_genres }}
                    </span>
                </div>
            </div>
        </div>

        <!-- Контейнер для сетки жанров -->
        <div id="genreGridContainer">
            {% include 'partials/genre_grid.html' %}
        </div>
    </div>
</div>

<script>
    function resetSearch() {
        document.getElementById('searchInput').value = '';

        htmx.ajax('GET', '{{ url_for("main.genre_list") }}', {
            target: '#genreGridContainer',
            values: { page: 1 }
        });
    }

    document.body.addEventListener('htmx:afterSwap', function (evt) {
        if (evt.detail.target.id === 'genreGridContainer') {
            const totalGenres = evt.detail.xhr.getResponseHeader('X-Total-Count');
            const currentPage = evt.detail.xhr.getResponseHeader('X-Current-Page');
            const totalPages = evt.detail.xhr.getResponseHeader('X-Total-Pages');

            if (totalGenres) {
                document.querySelector('.text-muted.mb-0').textContent = 'Всего жанров: ' + totalGenres;
            }

            const cards = document.querySelectorAll('#genreGridContainer .card.h-100').length;
            document.getElementById('resultCount').textContent = 'Найдено: ' + (totalGenres || cards);
        }
    });

    document.addEventListener('DOMContentLoaded', function () {
        const searchInput = document.getElementById('searchInput');
        const urlParams = new URLSearchParams(window.location.search);
        const search = urlParams.get('search');

        if (search) {
            searchInput.value = search;
        }
    });
</script>
{% endblock %}
