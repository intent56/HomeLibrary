{% extends "base.html" %}

{% block body_class %}bg-page4{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <!-- 1. ЗАГОЛОВОК СТРАНИЦЫ: белый цвет -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="text-white"><i class="bi bi-link-45deg"></i> Справочник агрегаторов</h2>
                <p class="text-white-50 mb-0">Управление сайтами-агрегаторами для поиска книг</p>
            </div>
            <div class="d-flex gap-2">
                <!-- 2. КНОПКА "НА ГЛАВНУЮ" - БЕЛЫЙ ТЕКСТ -->
                <a href="{{ url_for('main.index') }}" class="btn btn-outline-light">
                    <i class="bi bi-house"></i> На главную
                </a>
                <a href="{{ url_for('main.add_aggregator') }}" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Добавить агрегатор
                </a>
            </div>
        </div>

        <!-- 3. КОНТЕЙНЕР ДЛЯ ТАБЛИЦЫ - ПРОЗРАЧНЫЙ -->
        <div id="aggregatorTable" class="transparent-container">
            {% include 'partials/aggregator_table.html' %}
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Обработка события обновления таблицы
    document.body.addEventListener('htmx:afterSwap', function(evt) {
        if (evt.detail.target.id === 'aggregatorTable') {
            // Обновляем счетчик в футере
            const rows = document.querySelectorAll('#aggregatorTable tbody tr:not(#empty-row)').length;
            const footer = document.querySelector('.card-footer .text-white-50');
            if (footer) {
                footer.textContent = `Всего агрегаторов: ${rows}`;
            }
        }
    });

    // Обработка ошибок HTMX
    document.body.addEventListener('htmx:responseError', function(evt) {
        console.error('HTMX Error:', evt.detail);
        const alertDiv = document.createElement('div');
        alertDiv.className = 'alert alert-danger alert-dismissible fade show';
        alertDiv.innerHTML = `
            <i class="bi bi-exclamation-triangle"></i>
            Произошла ошибка при выполнении операции. Попробуйте обновить страницу.
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        `;
        document.querySelector('.container').prepend(alertDiv);
    });
});
</script>

<!-- СТИЛИ ДЛЯ ПРОЗРАЧНОЙ ТАБЛИЦЫ И ЭЛЕМЕНТОВ -->
<style>
/* 1. ПРОЗРАЧНЫЙ КОНТЕЙНЕР */
.transparent-container {
    background: transparent !important;
}

/* 2. СТИЛИ ДЛЯ БЕЛОГО ТЕКСТА */
.text-white {
    color: #ffffff !important;
}

.text-white-50 {
    color: rgba(255, 255, 255, 0.7) !important;
}

/* 3. КНОПКИ ВНЕ ТАБЛИЦЫ */
.btn-outline-light {
    color: #ffffff !important;
    border-color: rgba(255, 255, 255, 0.3) !important;
}

.btn-outline-light:hover {
    background-color: rgba(255, 255, 255, 0.2) !important;
    border-color: #ffffff !important;
    color: #ffffff !important;
}

/* 4. АДАПТИВНОСТЬ */
@media (max-width: 768px) {
    .d-flex.justify-content-between {
        flex-direction: column;
        align-items: stretch !important;
        gap: 1rem;
    }
}
</style>
{% endblock %}
