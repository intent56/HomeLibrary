{% extends "base.html" %} {% block body_class %}bg-page4{% endblock %} {% block
content %}
<div class="row">
  <div class="col-12">
    <!-- 1. ЗАГОЛОВОК СТРАНИЦЫ: белый цвет -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="text-white">
          <i class="bi bi-link-45deg"></i> Справочник агрегаторов
        </h2>
        <p class="text-white-50 mb-0">
          Управление сайтами-агрегаторами для поиска книг
        </p>
      </div>
      <div class="d-flex gap-2">
        <!-- 2. КНОПКА "НА ГЛАВНУЮ" - БЕЛЫЙ ТЕКСТ -->
        <a href="{{ url_for('main.index') }}" class="btn btn-outline-light">
          <i class="bi bi-house"></i> На главную
        </a>
        <!-- ИЗМЕНЕННАЯ КНОПКА "ДОБАВИТЬ АГРЕГАТОР" -->
        <a href="{{ url_for('main.add_aggregator') }}" class="btn btn-edit">
          <i class="bi bi-plus-circle"></i> Добавить агрегатор
        </a>
      </div>
    </div>

    <!-- 3. КОНТЕЙНЕР ДЛЯ ТАБЛИЦЫ - ПРОЗРАЧНЫЙ -->
    <div id="aggregatorTable" class="transparent-container">
      {% include 'partials/aggregator_table.html' %}
    </div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Обработка события обновления таблицы
    document.body.addEventListener("htmx:afterSwap", function (evt) {
      if (evt.detail.target.id === "aggregatorTable") {
        // Обновляем счетчик в футере
        const rows = document.querySelectorAll(
          "#aggregatorTable tbody tr:not(#empty-row)",
        ).length;
        const footer = document.querySelector(".card-footer .text-white-50");
        if (footer) {
          footer.textContent = `Всего агрегаторов: ${rows}`;
        }
      }
    });

    // Обработка ошибок HTMX
    document.body.addEventListener("htmx:responseError", function (evt) {
      console.error("HTMX Error:", evt.detail);
      const alertDiv = document.createElement("div");
      alertDiv.className = "alert alert-danger alert-dismissible fade show";
      alertDiv.innerHTML = `
            <i class="bi bi-exclamation-triangle"></i>
            Произошла ошибка при выполнении операции. Попробуйте обновить страницу.
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        `;
      document.querySelector(".container").prepend(alertDiv);
    });
  });
</script>

<!-- СТИЛИ ДЛЯ ПРОЗРАЧНОЙ ТАБЛИЦЫ И ЭЛЕМЕНТОВ -->
<style>
  /* 1. ПРОЗРАЧНЫЙ КОНТЕЙНЕР */
  .transparent-container {
    background: transparent !important;
  }

  /* 2. СТИЛИ ДЛЯ БЕЛОГО ТЕКСТА */
  .text-white {
    color: #ffffff !important;
  }

  .text-white-50 {
    color: rgba(255, 255, 255, 0.7) !important;
  }

  /* 3. КНОПКИ ВНЕ ТАБЛИЦЫ */
  .btn-outline-light {
    color: #ffffff !important;
    border-color: rgba(255, 255, 255, 0.3) !important;
  }

  .btn-outline-light:hover {
    background-color: rgba(255, 255, 255, 0.2) !important;
    border-color: #ffffff !important;
    color: #ffffff !important;
  }

  /* 4. СТИЛИ ДЛЯ КНОПКИ "ДОБАВИТЬ АГРЕГАТОР" */
  .btn-edit {
    background-color: transparent !important;
    color: var(--main-color) !important;
    border: 2px solid var(--main-color) !important;
    transition: all 0.3s ease !important;
    font-weight: 500 !important;
    padding: 0.5rem 1.2rem;
    border-radius: 6px;
    font-size: 0.95rem;
    letter-spacing: 0.3px;
  }

  .btn-edit:hover {
    background-color: var(--main-color) !important;
    color: #000000 !important;
    border-color: #000000 !important;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(255, 194, 0, 0.3);
  }

  .btn-edit:active {
    transform: translateY(0px);
    box-shadow: 0 2px 6px rgba(255, 194, 0, 0.2);
  }

  .btn-edit:focus {
    box-shadow: 0 0 0 3px rgba(255, 194, 0, 0.4);
    outline: none;
  }

  /* 5. АДАПТИВНОСТЬ */
  @media (max-width: 768px) {
    .d-flex.justify-content-between {
      flex-direction: column;
      align-items: stretch !important;
      gap: 1rem;
    }
  }
</style>

<!-- ===== ПРИНУДИТЕЛЬНЫЕ СТИЛИ ДЛЯ ПАГИНАЦИИ ===== -->
<!-- Переопределяем Bootstrap для пагинации в aggregatorTable -->
<style>
  #aggregatorTable .pagination .page-link {
    background-color: transparent !important;
    border-color: rgba(255, 255, 255, 0.15) !important;
    color: #ffffff !important;
  }

  #aggregatorTable .pagination .page-link:hover {
    background-color: rgba(255, 255, 255, 0.1) !important;
    border-color: rgba(255, 255, 255, 0.3) !important;
    color: #ffffff !important;
  }

  #aggregatorTable .pagination .page-item.active .page-link,
  #aggregatorTable .pagination .page-item.active .page-link:hover,
  #aggregatorTable .pagination .page-item.active .page-link:focus {
    background-color: var(--main-color) !important;
    border-color: var(--main-color) !important;
    color: #000000 !important;
    box-shadow: none !important;
  }

  #aggregatorTable .pagination .page-item.disabled .page-link,
  #aggregatorTable .pagination .page-item.disabled .page-link:hover {
    background-color: transparent !important;
    border-color: rgba(255, 255, 255, 0.05) !important;
    color: rgba(255, 255, 255, 0.2) !important;
  }

  /* Дополнительно: обнуляем фон контейнера пагинации */
  #aggregatorTable .pagination-container {
    background-color: rgba(0, 0, 0, 0.25) !important;
    backdrop-filter: blur(8px);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
</style>
{% endblock %}
