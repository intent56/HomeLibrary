{% extends "base.html" %} {% block body_class %}bg-page1{% endblock %} {% block
content %}
<div class="row">
  <div class="col-12">
    <!-- 1. ЗАГОЛОВОК СТРАНИЦЫ: белый цвет для иконки, заголовка и счетчика -->
    <div
      class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4"
    >
      <div class="text-center text-md-start mb-3 mb-md-0">
        <h2 class="main-text-color">
          <i class="bi bi-people"></i> Список авторов
        </h2>
        <strong class="text-white">Всего авторов: {{ total_authors }}</strong>
      </div>
      <div class="d-flex gap-2 flex-wrap justify-content-center">
        <!-- 2. КНОПКА "НА ГЛАВНУЮ" - БЕЛЫЙ ТЕКСТ -->
        <a
          href="{{ url_for('main.index') }}"
          class="btn btn-outline-light d-flex align-items-center"
        >
          <i class="bi bi-house me-1"></i> На главную
        </a>
        <a
          href="{{ url_for('authors.add_author') }}"
          class="btn btn-edit d-flex align-items-center"
        >
          <i class="bi bi-plus-circle me-1"></i> Добавить автора
        </a>
      </div>
    </div>

    <!-- 3. ПОИСК БЕЗ ПОДЛОЖКИ (УБРАНА КАРТОЧКА) -->
    <!-- Блок поиска с белой рамкой (гарантированно) -->
    <div
      class="search-fields-container"
      style="
        border: 2px solid rgba(255, 255, 255, 0.5) !important;
        border-radius: 8px;
        padding: 1rem;
        background: transparent;
      "
    >
      <div class="row g-3">
        <div class="col-md-10">
          <div class="input-group">
            <span
              class="input-group-text bg-transparent main-text-color border-light"
            >
              <i class="bi bi-search"></i>
            </span>
            <input
              type="text"
              class="form-control bg-transparent main-text-color border-light"
              id="searchInput"
              name="search"
              placeholder="Поиск по ФИО, фамилии..."
              value="{{ search or '' }}"
              hx-get="{{ url_for('authors.author_list') }}"
              hx-trigger="keyup changed delay:300ms"
              hx-target="#authorGridContainer"
              hx-indicator="#loadingIndicator"
              hx-push-url="true"
              hx-vals='{"page": 1}'
            />
            <span
              class="input-group-text bg-transparent border-light"
              id="loadingIndicator"
              style="display: none"
            >
              <span
                class="spinner-border spinner-border-sm main-text-color"
                role="status"
              ></span>
            </span>
          </div>
        </div>
        <div class="col-md-2">
          <button class="btn btn-outline-light" onclick="resetSearch()">
            <i class="bi bi-arrow-counterclockwise"></i> Сброс
          </button>
        </div>
      </div>
      <div class="mt-2">
        <span class="text-white-50 small" id="resultCount">
          Найдено: {{ pagination.total }}
        </span>
      </div>
    </div>

    <!-- Контейнер для сетки авторов -->
    <div id="authorGridContainer">
      {% include 'partials/author_grid.html' %}
    </div>
  </div>
</div>

<script>
  function resetSearch() {
    document.getElementById("searchInput").value = "";

    htmx.ajax("GET", '{{ url_for("authors.author_list") }}', {
      target: "#authorGridContainer",
      values: { page: 1 },
    });
  }

  // Обновление счетчика после HTMX
  document.addEventListener("htmx:afterSwap", function (event) {
    if (event.detail.target.id !== "authorGridContainer") return;

    const paginationEl = document.querySelector(
      "#authorGridContainer .pagination-container",
    );
    let total = paginationEl ? parseInt(paginationEl.dataset.total, 10) : null;

    // Если пагинации нет — проверяем пустую строку или считаем строки
    if (total === null || isNaN(total)) {
      if (document.querySelector("#authorGridContainer #empty-row")) {
        total = 0;
      } else {
        total = document.querySelectorAll(
          "#authorGridContainer tbody tr:not(#empty-row)",
        ).length;
      }
    }

    const resultCount = document.getElementById("resultCount");
    if (resultCount) {
      resultCount.textContent = `Найдено: ${total}`;
    }

    updateFilterLabels();
  });

  document.addEventListener("DOMContentLoaded", function () {
    const searchInput = document.getElementById("searchInput");
    const urlParams = new URLSearchParams(window.location.search);
    const search = urlParams.get("search");

    if (search) {
      searchInput.value = search;
    }
  });
</script>

<!-- ===== ПРИНУДИТЕЛЬНЫЕ СТИЛИ ДЛЯ ПАГИНАЦИИ ===== -->
<!-- Переопределяем Bootstrap для пагинации в authorGridContainer -->
<style>
  #authorGridContainer .pagination .page-link {
    background-color: transparent !important;
    border-color: rgba(255, 255, 255, 0.15) !important;
    color: #ffffff !important;
  }

  #authorGridContainer .pagination .page-link:hover {
    background-color: rgba(255, 255, 255, 0.1) !important;
    border-color: rgba(255, 255, 255, 0.3) !important;
    color: #ffffff !important;
  }

  #authorGridContainer .pagination .page-item.active .page-link,
  #authorGridContainer .pagination .page-item.active .page-link:hover,
  #authorGridContainer .pagination .page-item.active .page-link:focus {
    background-color: var(--main-color) !important;
    border-color: var(--main-color) !important;
    color: #000000 !important;
    box-shadow: none !important;
  }

  #authorGridContainer .pagination .page-item.disabled .page-link,
  #authorGridContainer .pagination .page-item.disabled .page-link:hover {
    background-color: transparent !important;
    border-color: rgba(255, 255, 255, 0.05) !important;
    color: rgba(255, 255, 255, 0.2) !important;
  }

  /* Дополнительно: обнуляем фон контейнера пагинации */
  #authorGridContainer .pagination-container {
    background-color: rgba(0, 0, 0, 0.25) !important;
    backdrop-filter: blur(8px);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
</style>
{% endblock %}
