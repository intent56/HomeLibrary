{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2><i class="bi bi-building"></i> Список издателей</h2>
                <p class="text-muted mb-0">Всего издателей: {{ total_publishers }}</p>
            </div>
            <div class="d-flex gap-2">
                <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary">
                    <i class="bi bi-house"></i> На главную
                </a>
                <a href="{{ url_for('main.add_publisher') }}" class="btn btn-primary btn-lg">
                    <i class="bi bi-plus-circle"></i> Добавить издателя
                </a>
            </div>
        </div>
        
        <!-- Поиск с HTMX -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-10">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" 
                                   class="form-control" 
                                   id="searchInput"
                                   name="search"
                                   placeholder="Поиск по названию издателя..." 
                                   value="{{ search or '' }}"
                                   hx-get="{{ url_for('main.publisher_list') }}"
                                   hx-trigger="keyup changed delay:300ms"
                                   hx-target="#publisherGridContainer"
                                   hx-indicator="#loadingIndicator"
                                   hx-push-url="true"
                                   hx-vals='{"page": 1}'>
                            <span class="input-group-text" id="loadingIndicator" style="display: none;">
                                <span class="spinner-border spinner-border-sm" role="status"></span>
                            </span>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-secondary w-100" 
                                onclick="resetSearch()">
                            <i class="bi bi-arrow-counterclockwise"></i> Сброс
                        </button>
                    </div>
                </div>
                <div class="mt-2">
                    <span class="text-muted small" id="resultCount">
                        Найдено: {{ total_publishers }}
                    </span>
                </div>
            </div>
        </div>
        
        <!-- Контейнер для сетки издателей -->
        <div id="publisherGridContainer">
            {% include 'partials/publisher_grid.html' %}
        </div>
    </div>
</div>

<script>
function resetSearch() {
    document.getElementById('searchInput').value = '';
    
    htmx.ajax('GET', '{{ url_for("main.publisher_list") }}', {
        target: '#publisherGridContainer',
        values: { page: 1 }
    });
}

document.body.addEventListener('htmx:afterSwap', function(evt) {
    if (evt.detail.target.id === 'publisherGridContainer') {
        const totalPublishers = evt.detail.xhr.getResponseHeader('X-Total-Count');
        const currentPage = evt.detail.xhr.getResponseHeader('X-Current-Page');
        const totalPages = evt.detail.xhr.getResponseHeader('X-Total-Pages');
        
        if (totalPublishers) {
            document.querySelector('.text-muted.mb-0').textContent = 'Всего издателей: ' + totalPublishers;
        }
        
        const cards = document.querySelectorAll('#publisherGridContainer .card.h-100').length;
        document.getElementById('resultCount').textContent = 'Найдено: ' + (totalPublishers || cards);
    }
});

document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('searchInput');
    const urlParams = new URLSearchParams(window.location.search);
    const search = urlParams.get('search');
    
    if (search) {
        searchInput.value = search;
    }
});
</script>
{% endblock %}
