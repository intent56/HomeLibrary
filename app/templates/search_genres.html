<div id="searchResults">
    {% if genres %}
        <div class="list-group">
            {% for genre in genres %}
                <div class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        <i class="bi bi-tag text-primary me-2"></i>
                        <div class="d-inline-block">
                            <strong>{{ genre.name }}</strong>
                            {% if genre.comment %}
                                <span class="text-muted ms-2 small">({{ genre.comment }})</span>
                            {% endif %}
                        </div>
                    </div>
                    <button class="btn btn-primary btn-sm add-genre-btn" 
                            data-genre-id="{{ genre.id }}">
                        <i class="bi bi-plus-circle"></i> Добавить
                    </button>
                </div>
            {% endfor %}
        </div>
        <div class="mt-2 text-muted small">
            <i class="bi bi-info-circle"></i> Найдено жанров: {{ genres|length }}
        </div>
    {% else %}
        <div class="alert alert-info mt-2" role="alert">
            <i class="bi bi-info-circle"></i>
            <strong>Жанры не найдены</strong>
            <p class="mb-0 mt-1">
                Попробуйте изменить поисковый запрос или 
                <a href="{{ url_for('main.add_genre') }}?book_id={{ request.args.get('book_id', 0) }}" 
                   class="alert-link">
                    <i class="bi bi-plus-circle"></i> Добавить новый жанр
                </a>
            </p>
        </div>
    {% endif %}
</div>
